name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/*.png"
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: English-only audit (no Cyrillic in kit docs)
        run: |
          if grep -rlP '[\x{0400}-\x{04FF}]' --include='*.md' --exclude-dir=.agents .; then
            echo "Cyrillic found in kit docs"; exit 1
          fi
          echo "clean"
      - name: Linkrot (kit-root docs)
        run: python3 scripts/check-links.py
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          find scripts templates -name '*.sh' -print0 | xargs -0 shellcheck
      - name: JSON validity (templates + docs)
        run: |
          find templates docs -name '*.json' -print0 | \
            xargs -0 -I{} python3 -c "import json,sys; json.load(open('{}')); print('ok {}')"

